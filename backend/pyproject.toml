[project]
name = "bantay-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "velasco", email = "velasco.shauntie19@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "insightface>=2.1",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "opencv-python>=5.1.0.95",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "python-pptx",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
bantay-backend = "bantay_backend:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
